name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raqeeb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/raqeeb
      DATABASE_URL: postgres://raqeeb_app:raqeeb_app@localhost:5432/raqeeb
      DATABASE_URL_SYSTEM: postgres://raqeeb_system:raqeeb_system@localhost:5432/raqeeb
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Migration drift check
        run: pnpm --filter @raqeeb/db check

      - name: Migrate (owner role; creates runtime roles idempotently)
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (includes the RLS tenant-isolation suite)
        run: pnpm test

      - name: Build all packages and apps
        run: pnpm build
