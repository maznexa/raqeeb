<style>
/* ============ HERO ============ */
.hero{position:relative;background:linear-gradient(180deg,#FBFAFE 0%,#F1EFF8 62%,var(--bg) 100%);padding:56px 0 0;border-bottom:1px solid var(--line)}
.hero-in{max-width:var(--w-content);margin:0 auto;padding:0 28px}
.hero-top{max-width:920px}
.hero-badge{display:inline-flex;align-items:center;gap:9px;padding:5px 13px 5px 6px;border-radius:100px;background:#fff;
  border:1px solid var(--line2);font-size:var(--fs-xs);color:var(--ink2);font-weight:600;margin-bottom:22px}
.hero-badge .d{width:18px;height:18px;border-radius:50%;background:var(--mintBg);display:grid;place-items:center;flex:0 0 18px}
.hero-badge .d i{width:6px;height:6px;border-radius:50%;background:var(--mintIc);display:block}
.hero h1{font-size:var(--fs-h1);font-weight:560;letter-spacing:-.035em;line-height:1.05;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--violet)}
.hero-sub{margin-top:20px;max-width:56ch;font-size:var(--fs-lead);color:var(--muted);line-height:1.5}
.hero-cta{margin-top:26px;display:flex;gap:11px;flex-wrap:wrap}
.hero-avail{margin-top:16px;font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-avail svg{width:14px;height:14px;color:var(--mintIc);flex:0 0 14px}
.hero-stage{position:relative;max-width:var(--w-content);margin:38px auto 0;padding:0 28px 78px}
@media (max-width:640px){.hero{padding-top:36px}.hero-in,.hero-stage{padding-inline:18px}.hero-stage{padding-bottom:52px;margin-top:26px}}

/* hero console tabs */
.contabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.contab{padding:9px 15px;border-radius:100px;background:#fff;border:1px solid var(--line2);font-size:var(--fs-xs);font-weight:600;color:var(--ink2);min-height:40px}
.contab:hover{border-color:var(--v300)}
.contab[aria-selected="true"]{background:var(--p800);border-color:var(--p800);color:#fff}
.conpanel[hidden]{display:none}
.toast{position:absolute;inset-inline-end:14px;bottom:26px;z-index:6;background:#fff;border:1px solid var(--line2);border-radius:13px;
  box-shadow:var(--shadow-lg);padding:11px 14px;display:flex;align-items:center;gap:11px;max-width:296px}
.toast .ti{width:34px;height:34px;border-radius:9px;background:var(--mintBg);display:grid;place-items:center;color:var(--mintIc);flex:0 0 34px}
.toast .ti svg{width:17px;height:17px}
.toast .tl{font-size:var(--fs-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);font-weight:600}
.toast .tt{font-size:var(--fs-xs);font-weight:600}
.toast .tv{margin-inline-start:6px;font-family:var(--display);font-weight:640;color:var(--mintIc);font-size:1rem}
@media (max-width:760px){.toast{position:static;max-width:none;margin-top:12px}}

/* ============ FLOW STRIP ============ */
.flowwrap{margin-top:36px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow-sm)}
.flow-svg{width:100%;height:auto;display:block}
.flow-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:4px}
@media (max-width:860px){.flow-labels{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.flow-labels{grid-template-columns:1fr}}
.flab .n{font-family:var(--display);font-weight:640;font-size:var(--fs-xs);color:var(--p600)}
.flab h3{font-family:var(--sans);font-weight:600;font-size:var(--fs-sm);margin:3px 0 4px;letter-spacing:-.01em}
.flab p{font-size:var(--fs-xs);color:var(--muted);line-height:1.45}

/* ============ CHAPTERS ============ */
/* composition A: narrow copy left, wide scene right that bleeds to the viewport edge */
.chap-bleed{display:grid;grid-template-columns:minmax(300px,382px) minmax(0,1fr);gap:48px;align-items:center}
.chap-bleed .scene{margin-inline-end:calc(-1 * max(28px, (100vw - var(--w-content)) / 2 + 28px))}
@media (max-width:1080px){.chap-bleed{grid-template-columns:1fr;gap:26px}.chap-bleed .scene{margin-inline-end:0}}
/* composition B: centered copy, then full content-width scene */
.chap-stack .chap-copy{max-width:var(--w-text);margin:0 auto 34px;text-align:center}
.chap-stack .chap-copy .eyebrow{justify-content:center}
/* composition C: scene left bleeding, copy right */
.chap-bleed-l{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,382px);gap:48px;align-items:center}
.chap-bleed-l .scene{margin-inline-start:calc(-1 * max(28px, (100vw - var(--w-content)) / 2 + 28px))}
@media (max-width:1080px){.chap-bleed-l{grid-template-columns:1fr;gap:26px}.chap-bleed-l .scene{margin-inline-start:0}.chap-bleed-l .chap-copy{order:-1}}
.chap-copy h2{font-size:var(--fs-chapter);font-weight:620;margin-top:14px}
.chap-copy .lead{font-size:var(--fs-base);margin-top:14px}
.benes{margin:22px 0 22px;display:flex;flex-direction:column;gap:15px}
.bene{display:flex;gap:11px;align-items:flex-start}
.bene .bi{flex:0 0 28px;width:28px;height:28px;border-radius:8px;background:var(--v50);display:grid;place-items:center;color:var(--violet-ink);margin-top:1px}
.bene .bi svg{width:15px;height:15px}
.bene b{font-weight:600;font-size:var(--fs-sm);display:block}
.bene p{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;line-height:1.5}
.band .bene .bi{background:rgba(255,255,255,.1);color:var(--v200)}
.band .bene b{color:#fff} .band .bene p{color:var(--p200)}
.band{background:var(--plum3);color:#fff}
.band h2,.band h3{color:#fff}
.band .lead{color:var(--p200)}
.band .lnk{color:var(--v200)}

/* ============ CAPABILITY GRID ============ */
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:36px}
@media (max-width:900px){.caps{grid-template-columns:1fr}}
.capcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;transition:border-color .18s,box-shadow .18s}
.capcard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.capcard .ch{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.capcard .ci{width:36px;height:36px;border-radius:10px;background:var(--p800);display:grid;place-items:center;color:var(--v200);flex:0 0 36px}
.capcard .ci svg{width:18px;height:18px}
.capcard h3{font-family:var(--sans);font-weight:600;font-size:var(--fs-h4);letter-spacing:-.015em}
.capcard ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.capcard li{display:flex;gap:9px;font-size:var(--fs-sm);color:var(--ink2);line-height:1.45}
.capcard li svg{width:14px;height:14px;color:var(--v500);flex:0 0 14px;margin-top:3px}

/* ============ SOLUTIONS ============ */
.sol{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;margin-top:34px}
.solrow{display:grid;grid-template-columns:236px 1fr auto;gap:22px;align-items:center;padding:22px 26px;border-top:1px solid var(--line);transition:background .16s}
.solrow:first-child{border-top:none}
.solrow:hover{background:var(--bg)}
.solrow .st{display:flex;align-items:center;gap:12px}
.solrow .sic{width:42px;height:42px;border-radius:11px;background:var(--p800);display:grid;place-items:center;color:var(--v200);flex:0 0 42px}
.solrow .sic svg{width:20px;height:20px}
.solrow .st h3{font-family:var(--sans);font-weight:600;font-size:var(--fs-h4);letter-spacing:-.015em}
.solrow .sd{color:var(--muted);font-size:var(--fs-sm);line-height:1.5}
.stags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stags span{font-size:var(--fs-micro);font-weight:600;color:var(--p600);background:#EDEAF4;padding:3px 9px;border-radius:100px}
@media (max-width:860px){.solrow{grid-template-columns:1fr;gap:11px;padding:20px}.solrow .arrow{display:none}}

/* ============ SECURITY ============ */
.secgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:34px}
@media (max-width:820px){.secgrid{grid-template-columns:1fr}}
.seccard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:13px}
.seccard .si{width:34px;height:34px;border-radius:9px;background:var(--v50);display:grid;place-items:center;color:var(--violet-ink);flex:0 0 34px}
.seccard .si svg{width:17px;height:17px}
.seccard h3{font-family:var(--sans);font-weight:600;font-size:var(--fs-sm);letter-spacing:-.01em}
.seccard p{font-size:var(--fs-xs);color:var(--muted);margin-top:4px;line-height:1.5}
.secnote{margin-top:16px;font-size:var(--fs-xs);color:var(--muted2);text-align:center;max-width:74ch;margin-inline:auto;line-height:1.55}

/* ============ REFUSALS ============ */
.refuse{list-style:none;padding:0;margin:26px 0 0;max-width:820px}
.refuse li{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,1.85rem);font-weight:600;color:var(--p400);
  text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--v500);
  padding:15px 0;border-bottom:1px solid rgba(255,255,255,.09);letter-spacing:-.02em}
.refuse-foot{margin-top:26px;font-size:var(--fs-lead);color:#fff;max-width:64ch;line-height:1.5}

/* ============ PRICING ============ */
.prctrl{display:flex;justify-content:center;gap:10px;margin:24px 0 34px;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border-radius:100px;padding:4px;border:1px solid var(--line2)}
.seg button{padding:9px 16px;border-radius:100px;font-weight:600;font-size:var(--fs-xs);color:var(--muted);min-height:38px;display:inline-flex;align-items:center}
.seg button[aria-checked="true"]{background:var(--violet);color:#fff}
.segsave{margin-inline-start:7px;font-size:var(--fs-micro);font-weight:600;background:var(--mintBg);color:var(--mintIc);padding:2px 7px;border-radius:100px}
.seg button[aria-checked="true"] .segsave{background:rgba(255,255,255,.22);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:stretch}
@media (max-width:1000px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.pgrid{grid-template-columns:1fr}}
.plan{border:1px solid var(--line);border-radius:16px;background:#fff;padding:22px 20px;display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s}
.plan:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.plan.reco{border-color:var(--violet);box-shadow:0 12px 40px rgba(37,25,64,.12);position:relative}
.plan .flagline{position:absolute;top:-10px;inset-inline-start:20px;background:var(--violet);color:#fff;font-size:var(--fs-micro);font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:100px}
.plan h3{font-family:var(--display);font-weight:640;font-size:var(--fs-h4)}
.plan .pd{font-size:var(--fs-xs);color:var(--muted);margin:5px 0 15px;min-height:2.8em;line-height:1.4}
.plan .pp{display:flex;align-items:baseline;gap:4px}
.plan .amt{font-family:var(--display);font-weight:640;font-size:2rem;letter-spacing:-.035em}
.plan .per{font-size:var(--fs-xs);color:var(--muted)}
.plan .psar{font-size:var(--fs-micro);color:var(--muted2);margin-top:4px;min-height:1.2em}
.plan ul{list-style:none;padding:0;margin:16px 0 18px;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;gap:8px;font-size:var(--fs-xs);color:var(--ink2);line-height:1.45}
.plan li svg{width:14px;height:14px;color:var(--mintIc);flex:0 0 14px;margin-top:2px}
.plan .btn{width:100%;margin-top:auto}
.pricenote{margin-top:20px;text-align:center;font-size:var(--fs-xs);color:var(--muted);max-width:70ch;margin-inline:auto;line-height:1.6}

/* ============ FAQ ============ */
.faq{max-width:820px;margin:34px auto 0;border-top:1px solid var(--line2)}
.faq details{border-bottom:1px solid var(--line2)}
.faq summary{list-style:none;cursor:pointer;padding:18px 40px 18px 0;font-family:var(--display);font-weight:600;font-size:var(--fs-h4);position:relative;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;inset-inline-end:8px;top:24px;width:10px;height:10px;border-inline-end:2px solid var(--muted);border-block-end:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg)}
.faq p{padding:0 0 20px;font-size:var(--fs-sm);color:var(--muted);line-height:1.6;max-width:68ch}

/* ============ FINAL CTA ============ */
.finalcta{background:radial-gradient(120% 130% at 15% 0%,#3A2168,var(--p800) 46%,var(--p900));padding:104px 0}
.cta-in{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
@media (max-width:900px){.cta-in{grid-template-columns:1fr;gap:28px}.finalcta{padding:64px 0}}
.cta-in h2{font-size:var(--fs-h2);font-weight:600;margin-top:14px}
.agenda{margin-top:22px}
.agenda div{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid rgba(255,255,255,.13);font-size:var(--fs-sm);color:#E6E1F4}
.agenda .mins{font-family:var(--display);font-weight:640;color:var(--v200);width:70px;flex:0 0 70px}
.demoform{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px}
.demoform h3{color:#fff;font-size:var(--fs-h3);font-weight:620}
.hostline{display:flex;align-items:center;gap:11px;margin:14px 0 18px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.12)}
.hostline .av{width:38px;height:38px;border-radius:50%;background:var(--v500);display:grid;place-items:center;font-weight:600;color:#fff;font-size:var(--fs-xs);flex:0 0 38px}
.hostline p{font-size:var(--fs-xs);color:var(--p200);line-height:1.45}
.hostline b{color:#fff;font-weight:600;display:block;font-size:var(--fs-sm)}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ff .full{grid-column:1/-1}
@media (max-width:560px){.ff{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:var(--fs-micro);font-weight:600;color:#CFC7EC}
.fld input,.fld select,.fld textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.19);border-radius:10px;padding:11px 12px;
  color:#fff;font-family:inherit;font-size:var(--fs-sm);min-height:44px}
.fld textarea{resize:vertical;min-height:70px}
.fld input::placeholder,.fld textarea::placeholder{color:#8F86B5}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--v400);background:rgba(255,255,255,.11)}
.fld select option{color:#171320}
.formnote{font-size:var(--fs-micro);color:#A99FD6;margin-top:12px;line-height:1.55}
.formnote a{color:var(--v200);text-decoration:underline}
.formmsg{margin-top:12px;font-size:var(--fs-xs);font-weight:600;display:none}
.demoform .btn{width:100%;margin-top:14px}

/* ============ FOOTER ============ */
.foot{background:var(--p900);color:#CFC7EC;padding:70px 0 26px;border-top:1px solid rgba(255,255,255,.08)}
.foot-grid{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:30px}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr;gap:26px}}
.foot-about{margin-top:14px;font-size:var(--fs-xs);color:#A99FD6;max-width:32ch;line-height:1.6}
.foot-lock{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.09)}
.foot-lock .ar-word{font-family:var(--arabic);font-size:1.35rem;color:#fff;font-weight:600;line-height:1}
.foot-lock .sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
.foot h4{font-family:var(--sans);font-weight:600;font-size:var(--fs-micro);letter-spacing:.1em;text-transform:uppercase;color:#8F86B5;margin-bottom:13px}
.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.foot ul a{font-size:var(--fs-xs);color:#CFC7EC;display:inline-block;padding:3px 0}
.foot ul a:hover{color:#fff}
.foot-bottom{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:var(--fs-micro);color:#8F86B5}
.foot-bottom b{color:#fff;font-weight:600}

/* ============ MOTION ============ */
.js .rev{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.js .rev.in{opacity:1;transform:none}
.js .rev.soft{transform:scale(.995)}
.js .rev.soft.in{transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .js .rev{opacity:1;transform:none}
}
</style>
<style>
/* official mark sizing. symbol ratio 2048:458 for the wordmark, 396:458 for the Q */
.wordmark{display:block;height:26px;width:116px;color:var(--ink)}
.hdr .wordmark{height:27px;width:121px}
.r-word{height:18px;width:80px;color:#fff;margin:2px 6px 14px}
.foot .wordmark{height:28px;width:125px;color:#fff}
.qi{width:12px;height:14px;flex:0 0 12px;color:var(--v400)}
.band .qi,.foot .qi{color:var(--v300)}
@container (max-width:720px){.r-word{width:26px;height:30px}}
</style>
