<style>
/* ============ PRODUCT SCENE SHELL ============ */
.scene{position:relative}
.scene-cap{margin-top:12px;font-size:var(--fs-micro);font-weight:600;letter-spacing:.02em;color:var(--muted2);display:flex;align-items:center;gap:8px}
.scene-cap svg{width:13px;height:13px;color:var(--v400);flex:0 0 13px}
.band .scene-cap{color:var(--p400)}
.win{background:var(--white);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;container-type:inline-size}
.band .win{border-color:rgba(255,255,255,.12)}
.win-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FCFBFE}
.win-bar .dots{display:flex;gap:6px;flex:0 0 auto}
.win-bar .dots i{width:10px;height:10px;border-radius:50%;display:block;background:var(--line2)}
.win-crumb{font-size:var(--fs-xs);color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-crumb b{color:var(--ink);font-weight:600}
.win-kbd{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-micro);color:var(--muted2);
  border:1px solid var(--line2);border-radius:7px;padding:3px 8px;background:#fff;flex:0 0 auto}
@container (max-width:560px){.win-kbd{display:none}}
.win-body{display:grid;grid-template-columns:196px 1fr}
@container (max-width:720px){.win-body{grid-template-columns:56px 1fr}.rail .rl-txt,.rail .r-lab,.rail .r-foot div,.rail .rcount{display:none}.rail a{justify-content:center;padding:10px 0}}
@container (max-width:420px){.win-body{grid-template-columns:1fr}.rail{display:none}}
.rail{background:var(--plum);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.rail .r-word{color:#fff;margin:2px 6px 14px}
.rail .r-lab{font-size:var(--fs-micro);letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.42);font-weight:600;padding:0 8px;margin-bottom:8px}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:rgba(255,255,255,.68);font-weight:500;font-size:var(--fs-xs)}
.rail a svg{width:16px;height:16px;flex:0 0 16px}
.rail a.on{background:var(--v600);color:#fff}
.rail .rcount{margin-inline-start:auto;font-size:var(--fs-micro);font-weight:600;color:rgba(255,255,255,.5)}
.rail a.on .rcount{color:rgba(255,255,255,.85)}
.rail .r-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid rgba(255,255,255,.09)}
.rail .r-foot .av{width:30px;height:30px;border-radius:50%;background:var(--v500);display:grid;place-items:center;font-size:var(--fs-micro);font-weight:600;color:#fff;flex:0 0 30px}
.rail .r-foot b{color:#fff;font-size:var(--fs-xs);font-weight:600;display:block;line-height:1.3}
.rail .r-foot span{color:rgba(255,255,255,.45);font-size:var(--fs-micro)}
.work{padding:16px;min-width:0}

/* scene toolbar: the single highest leverage realism device */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg-view{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg-view button,.seg-view span{padding:5px 11px;border-radius:7px;font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.seg-view .on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:var(--fs-xs);font-weight:500;color:var(--ink2)}
.tchip svg{width:13px;height:13px;color:var(--muted2)}
.tchip.act{border-color:var(--v300);background:var(--v50);color:var(--violet-ink)}
.tchip .x{color:var(--muted2);font-weight:600}
.tbar .right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.avstack{display:flex}
.avstack .av{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-inline-start:-8px;display:grid;place-items:center;font-size:var(--fs-micro);font-weight:600;color:#fff}
.win .btn-primary{box-shadow:none;font-size:var(--fs-xs);padding:7px 12px;border-radius:9px;min-height:32px}
@container (max-width:560px){.tbar .right .btn-primary span{display:none}}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@container (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.kpi .kt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kpi .kic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 26px}
.kpi .kic svg{width:14px;height:14px}
.kpi .kl{font-size:var(--fs-micro);font-weight:600;color:var(--muted);letter-spacing:.01em}
.kpi .kv{font-family:var(--display);font-weight:640;font-size:1.6rem;letter-spacing:-.03em;line-height:1}
.kpi .krow{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.kpi .kd{font-size:var(--fs-micro);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.kpi .kd.up{color:var(--mintIc)} .kpi .kd.dn{color:var(--coralIc)} .kpi .kd.fl{color:var(--muted2)}
.kpi .ks{font-size:var(--fs-micro);color:var(--muted2);margin-top:4px}
.kspark{display:block;width:100%;height:22px;margin-top:8px}
.ic-lilac{background:var(--v50);color:var(--violet-ink)} .ic-amber{background:var(--amberBg);color:var(--amberIc)}
.ic-mint{background:var(--mintBg);color:var(--mintIc)} .ic-coral{background:var(--coralBg);color:var(--coralIc)}

/* panels */
.pgrid2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:12px}
.pgrid-eq{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@container (max-width:820px){.pgrid2,.pgrid-eq{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.p-head h4{font-family:var(--sans);font-weight:600;font-size:var(--fs-sm);letter-spacing:-.01em}
.p-head .p-sub{font-size:var(--fs-micro);color:var(--muted2);display:block;font-weight:500;margin-top:1px}
.p-head .right{margin-inline-start:auto;display:flex;align-items:center;gap:7px}
.tag{font-size:var(--fs-micro);font-weight:600;color:var(--muted2)}
.ilink{font-size:var(--fs-micro);font-weight:600;color:var(--violet-ink);display:inline-flex;align-items:center;gap:4px}
.ilink svg{width:11px;height:11px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:100px;font-size:var(--fs-micro);font-weight:600;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;display:block;flex:0 0 6px}
.chip.ok{background:var(--mintBg);color:var(--mintIc)}.chip.ok i{background:var(--mintIc)}
.chip.warn{background:var(--amberBg);color:var(--amberIc)}.chip.warn i{background:var(--amberIc)}
.chip.risk{background:var(--coralBg);color:var(--coralIc)}.chip.risk i{background:var(--coralIc)}
.chip.neu{background:var(--bg);color:var(--muted)}.chip.neu i{background:var(--muted2)}
.chip.vio{background:var(--v50);color:var(--violet-ink)}.chip.vio i{background:var(--violet)}

/* signals */
.sigrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.sigrow:first-of-type{border-top:none}
.sigrow .num{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:var(--fs-micro);font-weight:600;flex:0 0 22px}
.sigrow .sc{flex:1;min-width:0}
.sigrow .sc b{font-size:var(--fs-xs);font-weight:600;display:block}
.sigrow .sc span{font-size:var(--fs-micro);color:var(--muted)}
.sigrow .sa{font-size:var(--fs-micro);font-weight:600;color:var(--violet-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.sigrow .sa svg{width:11px;height:11px}
@container (max-width:520px){.sigrow .sa span{display:none}}

/* donut + bars */
.donut{position:relative;width:132px;height:132px;margin:0 auto}
.donut svg{transform:rotate(-90deg)}
.donut .dn{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.donut .dn b{font-family:var(--display);font-weight:640;font-size:1.9rem;letter-spacing:-.03em;display:block}
.donut .dn span{font-size:var(--fs-micro);color:var(--muted);font-weight:600}
.barmini{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:12px}
.barmini i{flex:1;border-radius:3px 3px 0 0;background:var(--v200);display:block}
.barmini i.hi{background:var(--v500)}
.axrow{display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--muted2);margin-top:6px;font-weight:500}

/* tables */
.dt{width:100%;font-size:var(--fs-xs)}
.dt th{text-align:start;font-weight:600;color:var(--muted);font-size:var(--fs-micro);padding:0 8px 8px;white-space:nowrap}
.dt td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
.dt tbody tr.sel td{background:var(--v50)}
.dt .pj{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;display:block}
.dt .who{color:var(--muted)}
.prog{height:6px;border-radius:100px;background:var(--stage);overflow:hidden;min-width:56px}
.prog i{display:block;height:100%;background:var(--violet);border-radius:100px}
.avm{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-micro);font-weight:600;color:#fff;flex:0 0 22px}
.avm.a1{background:var(--v500)} .avm.a2{background:var(--mintIc)} .avm.a3{background:var(--amberIc)} .avm.a4{background:var(--coralIc)} .avm.a5{background:var(--p600)}
.withav{display:inline-flex;align-items:center;gap:7px}
.morerow{padding:9px 8px;border-top:1px solid var(--line);font-size:var(--fs-micro);color:var(--muted2);font-weight:600}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
@container (max-width:760px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:420px){.board{grid-template-columns:1fr}}
.bcol{min-width:0}
.col-h{display:flex;align-items:center;gap:7px;font-size:var(--fs-micro);font-weight:600;color:var(--muted);margin-bottom:8px;padding:0 2px}
.col-h i{width:7px;height:7px;border-radius:2px;display:block;flex:0 0 7px}
.col-h .c{margin-inline-start:auto;background:var(--bg);color:var(--muted);border-radius:20px;padding:1px 7px}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;box-shadow:var(--shadow-sm)}
.tk.sel{border-color:var(--violet);box-shadow:0 0 0 2px var(--v100)}
.tk .tlab{display:inline-block;font-size:var(--fs-micro);font-weight:600;padding:1px 6px;border-radius:5px;margin-bottom:5px}
.tk .tt{font-size:var(--fs-xs);font-weight:600;line-height:1.35}
.tk .tsub{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:var(--fs-micro);color:var(--muted2);font-weight:500}
.tk .tsub span{display:inline-flex;align-items:center;gap:3px}
.tk .tsub svg{width:11px;height:11px}
.tk .tm{display:flex;align-items:center;gap:6px;margin-top:8px}
.pr{font-size:var(--fs-micro);font-weight:600;padding:1px 6px;border-radius:5px}
.pr.hi{background:var(--coralBg);color:var(--coralIc)}.pr.me{background:var(--amberBg);color:var(--amberIc)}.pr.lo{background:var(--bg);color:var(--muted)}
.tk .due{margin-inline-start:auto;font-size:var(--fs-micro);color:var(--muted2);font-weight:600}
.tk .due.late{color:var(--coralIc)}
.subprog{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:var(--fs-micro);color:var(--muted2);font-weight:600}
.subprog .prog{flex:1;height:4px;min-width:0}

/* drawer */
.drawer{border:1px solid var(--line2);border-radius:13px;background:#fff;box-shadow:var(--shadow);padding:14px}
.drawer .dh{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.drawer h5{font-family:var(--display);font-weight:640;font-size:1.05rem;margin:2px 0 7px;letter-spacing:-.02em}
.drawer .dl{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:var(--fs-xs)}
.drow .dk{color:var(--muted);width:74px;flex:0 0 74px}
.dtabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:10px 0 2px}
.dtabs span{padding:7px 0;font-size:var(--fs-xs);font-weight:600;color:var(--muted2);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs .on{color:var(--violet-ink);border-bottom-color:var(--violet)}
.timer{display:inline-flex;align-items:center;gap:7px;background:var(--p800);color:#fff;border-radius:9px;padding:6px 10px;font-family:var(--display);font-weight:600;font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.timer .rec{width:8px;height:8px;border-radius:50%;background:#F08A6E;animation:rec 2s infinite}
@keyframes rec{0%,100%{opacity:1}50%{opacity:.35}}

/* capacity planner */
.capwrap{overflow-x:auto}
.cap{width:100%;border-spacing:3px;border-collapse:separate;font-size:var(--fs-micro);min-width:520px}
.cap th{font-weight:600;color:var(--muted);padding:2px;text-align:center;font-size:var(--fs-micro)}
.cap th.wk small{display:block;color:var(--muted2);font-weight:500}
.cap .pcell{text-align:start;min-width:150px;padding-inline-end:6px}
.cap .pn{display:flex;align-items:center;gap:7px;font-weight:600;font-size:var(--fs-xs)}
.cap .role{color:var(--muted2);margin-inline-start:29px;display:block}
.cap .grouprow td{padding:10px 4px 4px;font-weight:600;color:var(--muted);font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase}
.cell{height:32px;border-radius:7px;display:grid;place-items:center;font-weight:600;font-size:var(--fs-micro);position:relative}
.cell.c0{background:var(--stage);color:var(--muted)}
.cell.c1{background:var(--v100);color:var(--v800)}
.cell.c2{background:var(--v300);color:#fff}
.cell.c3{background:var(--v500);color:#fff}
.cell.over{background:var(--coralIc);color:#fff}
.cell.leave{background:repeating-linear-gradient(45deg,var(--v50),var(--v50) 5px,var(--v100) 5px,var(--v100) 10px);color:var(--v800)}
.capend{text-align:end;font-weight:600;font-size:var(--fs-xs);white-space:nowrap}
.capend small{display:block;font-weight:500;font-size:var(--fs-micro)}
.caplegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:var(--fs-micro);color:var(--muted);align-items:center}
.caplegend span{display:inline-flex;align-items:center;gap:6px}
.caplegend i{width:12px;height:12px;border-radius:3px;display:block;box-shadow:inset 0 0 0 1px rgba(23,19,32,.12)}
.hintbox{margin-top:12px;border:1px solid var(--v200);border-radius:12px;background:var(--v50);padding:12px;display:flex;gap:11px}
.hintbox .hi{flex:0 0 30px;width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--violet-ink)}
.hintbox .hi svg{width:16px;height:16px}
.hintbox b{font-size:var(--fs-xs);display:block}
.hintbox p{font-size:var(--fs-micro);color:var(--ink2);margin-top:3px;line-height:1.5}
.hintbox .verdicts{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap}
.hintbox .verdicts span{font-size:var(--fs-micro);font-weight:600;color:var(--violet-ink)}

/* timesheet */
.ts{width:100%;font-size:var(--fs-xs);min-width:520px}
.ts th{font-weight:600;color:var(--muted);font-size:var(--fs-micro);padding:0 6px 8px;text-align:center}
.ts th.l{text-align:start}
.ts td{padding:7px 6px;border-top:1px solid var(--line);text-align:center}
.ts td.l{text-align:start;font-weight:600}
.ts td.l small{display:block;color:var(--muted2);font-weight:500;font-size:var(--fs-micro)}
.hh{display:inline-block;min-width:34px;padding:3px 7px;border-radius:6px;background:var(--bg);font-weight:600;font-variant-numeric:tabular-nums}
.hh.b{background:var(--v50);color:var(--violet-ink)}
.hh.empty{background:transparent;border:1px dashed var(--line2);color:var(--muted2)}
.ts tfoot td{border-top:2px solid var(--line2);font-weight:700;padding-top:9px}
.ubar{display:flex;align-items:center;gap:10px;margin:9px 0}
.ubar .ul{width:96px;flex:0 0 96px;font-size:var(--fs-xs);font-weight:600}
.ubar .ut{flex:1;height:12px;border-radius:100px;background:var(--stage);overflow:hidden;position:relative}
.ubar .ut i{display:block;height:100%;border-radius:100px;background:var(--v500)}
.ubar .ut .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--p600)}
.ubar .uv{width:40px;flex:0 0 40px;text-align:end;font-weight:600;font-size:var(--fs-xs)}

/* money */
.moneyrow{padding:10px 0;border-top:1px solid var(--line)}
.moneyrow:first-child{border-top:none}
.moneyrow .mt{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-xs);margin-bottom:6px;gap:10px}
.moneyrow .mt small{color:var(--muted2);font-weight:500}
.moneyrow .mt b{font-weight:600;font-variant-numeric:tabular-nums}
.moneyrow .mb{height:7px;border-radius:100px;background:var(--stage);overflow:hidden}
.moneyrow .mb i{display:block;height:100%;border-radius:100px}
.combars{display:flex;align-items:flex-end;gap:8px;height:132px;padding-top:6px}
.combars .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.combars .cb i{width:100%;border-radius:4px 4px 0 0;background:var(--v200);display:block}
.combars .cb.hi i{background:var(--v500)}
.combars .cb span{font-size:var(--fs-micro);color:var(--muted2);font-weight:500}

/* heatmap */
.heat{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:4px;font-size:var(--fs-micro)}
.heat .hx{color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.heat .hy{color:var(--muted);font-weight:600;display:flex;align-items:center;padding-inline-end:8px;white-space:nowrap}
.hcell{aspect-ratio:2/1;border-radius:6px;display:grid;place-items:center;font-weight:600;min-height:26px}
.hcell.h0{background:var(--mintBg);color:var(--mintIc)}
.hcell.h1{background:var(--amberBg);color:var(--amberIc)}
.hcell.h2{background:var(--coralBg);color:var(--coralIc)}
.hcell.hn{background:var(--stage);color:var(--muted2)}

/* gantt */
.gantt{min-width:560px}
.gt-head{display:grid;grid-template-columns:150px 1fr;font-size:var(--fs-micro);color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:6px}
.gt-months{display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.gt-row{display:grid;grid-template-columns:150px 1fr;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.gt-name{font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:7px;padding-inline-end:10px}
.gt-name small{color:var(--muted2);font-weight:500}
.gt-track{position:relative;height:24px;background:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16.666% 100%}
.gt-bar{position:absolute;top:5px;height:14px;border-radius:5px;background:var(--v400);display:flex;align-items:center;padding:0 6px;font-size:var(--fs-micro);color:#fff;font-weight:600;overflow:hidden}
.gt-bar.done{background:var(--v200);color:var(--v800)}
.gt-bar.risk{background:var(--coralIc)}
.gt-ms{position:absolute;top:2px;width:11px;height:11px;background:var(--p800);transform:rotate(45deg) translateY(4px);border-radius:2px}
.gt-today{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--violet);z-index:2}
</style>
